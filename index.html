<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Paper Scissors</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="gameContainer">
    <h1>Rock Paper Scissors Game</h1>
    <p>Pick one of the move or user 'r' 'p' or 's'</p>
    <div class="moveButtons">
      <button class="rock">Rock</button>
      <button class="paper">Paper</button>
      <button class="scissors">Scissors</button>
    </div>
    <!--this is where the user move and bot move and result will go-->
    <div class="resultContainer">
    
    </div>
    <div class="Scoreboard">
      <!--this is where the scoreboard will go -->
      
    </div>
    <div class="ActionButtonContainer">
      <button class="resetScore">Reset Score</button>
      <button class="autoPlay">Auto Play</button>
    </div>
  </div>


  <script src="/main.js"></script>
</body>
</html>
