<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Paper Scissors</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="gameContainer">
    <h1>Rock Paper Scissors Game</h1>
    <p class="instructions">Pick one of the move or use 'r' 'p' or 's' Key </p>
    <div class="moveButtons">
      <button><img class="rock" src="images/Rock.png" alt="Rock"></button>
      <button><img class="paper" src="images/paper.png" alt="Paper"></button>
      <button><img class="scissors" src="images/scissors.png" alt="Scissors"></button>
    </div>
    <!--this is where the user move and bot move and result will go-->
    <div class="resultContainer">
    
    </div>
    <div class="scoreboard">
      <!--this is where the scoreboard will go -->
      
    </div>
    <div class="ActionButtonContainer">
      <button class="resetScore greeButton">Reset Score</button>
      <button class="autoPlay redButton">Auto Play</button>
    </div>
  </div>


  <script src="main.js"></script>
</body>
</html>
